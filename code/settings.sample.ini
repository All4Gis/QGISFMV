/ QGIS FMV — settings template (copy to settings.ini if needed)
/
/ The plugin reads code/settings.ini at runtime. On first start it creates that file
/ automatically with defaults. Prefer **FMV Settings** in the QGIS toolbar to edit
/ paths instead of editing this file by hand.
/
/ Platform-specific path examples (only ffmpeg and dtm_file usually change):
/   Windows : ffmpeg = C:\FFMPEG          dtm_file = C:\data\elevation.tif
/   Linux   : ffmpeg = /usr/bin           dtm_file = /home/user/DEM.tif
/   macOS   : ffmpeg = /opt/homebrew/bin  dtm_file =
/
/ Leave ffmpeg empty to auto-detect. Leave dtm_file empty if you do not use a DEM.

[GENERAL]
/dtm_file: optional elevation raster (GeoTIFF, HGT, …) for ground intersection
dtm_file :
/dtm_buffer_size: DEM tile size in pixels loaded around each frame
dtm_buffer_size : 2000
/reverse_geocoding_url: HTTP template; {} placeholders = lat, lon (Nominatim requires a User-Agent; FMV sets one automatically)
reverse_geocoding_url : https://nominatim.openstreetmap.org/reverse?format=json&lat={}&lon={}
/ffmpeg: folder containing ffmpeg and ffprobe (or full path to ffmpeg binary)
ffmpeg :
/min_buffer_size: KLV/metadata read buffer; very high values can crash the plugin
min_buffer_size : 5

[LAYERS]
/ Default QGIS layer and group names created per video (change only if you need custom names)
platform_lyr : Platform
beams_lyr : Beams
footprint_lyr : Footprint
trajectory_lyr : Trajectory
framecenter_lyr : Frame Center
frameaxis_lyr : Frame Axis
point_lyr : Drawings Point
symbol_lyr : Military Symbols
line_lyr : Drawings Line
polygon_lyr : Drawings Polygon
objecttrack_lyr : Object Track
objectposition_lyr : Object Position
epsg : EPSG:4326
frames_g : FMV Georeferenced Frames

[MOSAIC]
/ Live georeferenced mosaic tuning (see QgsFmvMosaicController)
min_interval_sec : 2.0
min_move_meters : 30
max_frame_dimension : 960
feather_px : 56
max_output_size : 2048
footprint_grow_ratio : 1.12
footprint_grow_meters : 35
refresh_every : 3
display_every : 2
/ max_kept_frames: prune old g_*.tiff already baked into mosaic (disk)
max_kept_frames : 80

[DNN]
/ Optional YOLO ONNX for Vehicle/Person detection (OpenCV DNN, no extra pip in QGIS).
/use_dnn_detection: true when onnx_model points to a valid .onnx file
use_dnn_detection : false
/dnn_model_profile: aerial (VisDrone, FMV/UAV), coco (ground-level), or custom
dnn_model_profile : aerial
/onnx_model: absolute path, e.g. ~/.qgis-fmv-models/visdrone-yolov8n.onnx
onnx_model :
/onnx_model_type: yolov8 or yolov5
onnx_model_type : yolov8
/onnx_input_size: network input side (usually 640)
onnx_input_size : 640
/onnx_confidence: 0..1 (try 0.15 for small aerial objects)
onnx_confidence : 0.15
/onnx_nms: 0..1
onnx_nms : 0.45
/ Per-filter YOLO class ids (comma-separated). Empty = profile default (VisDrone or COCO).
/ VisDrone: vehicle=3,4,5,8,9  person=0,1
/ COCO: vehicle=2,3,5,7  person=0
dnn_vehicle_class_ids :
dnn_person_class_ids :
dnn_building_class_ids :
dnn_road_class_ids :
dnn_fire_class_ids :
dnn_smoke_class_ids :
dnn_flood_class_ids :
/ Example custom FMV model (7 classes): building=0, road=1, vehicle=2, person=3, fire=4, smoke=5, flood=6
/ dnn_building_class_ids : 0
/ dnn_road_class_ids : 1
/ dnn_vehicle_class_ids : 2
/ dnn_person_class_ids : 3
/ dnn_fire_class_ids : 4
/ dnn_smoke_class_ids : 5
/ dnn_flood_class_ids : 6
/ Optional per-filter ONNX override (empty = use onnx_model above)
onnx_model_building :
onnx_model_road :
onnx_model_vehicle :
onnx_model_person :
onnx_model_fire :
onnx_model_smoke :
onnx_model_flood :

[FILTERS]
/ profile: aerial (FMV/UAV), coco (ground-level), or custom
profile : aerial
/ Overlay tuning — lower abs_thr and weight_gate show more detections on aerial video
overlay_abs_threshold : 0.10
overlay_adaptive_min_cov : 0.6
overlay_weight_gate : 0.12
overlay_adaptive_percentile : 74
/ CV detection pipeline — percentile and thresholds (lower = more sensitive)
detection_percentile : 70
detection_default_threshold : 0.10
detection_min_pos : 20
detection_min_area_frac : 0.000012
detection_min_extent : 0.08
detection_mask_blend : 0.55
vehicle_min_area_frac : 0.000006
person_min_area_frac : 0.00004
building_min_area_frac : 0.0006
road_min_area_frac : 0.0008
/ Temporal smoothing and preprocessing
ema_alpha : 0.42
clahe_pregain : true
/ When YOLO finds nothing, fall back to classical CV (recommended)
dnn_fallback_when_empty : true
multiscale_detection : true
box_nms_iou : 0.42
show_box_confidence : true
tracking_enabled : true

[FILES]
/ Video extensions for file dialogs (Python list syntax)
exts : ["All Videos *.ts *.mpeg4 *.mp4 *.avi *.mpg *.H264 *.mov *.mpeg", "ts","mpeg4","mp4","avi","mpg","H264","mov","mpeg"]
