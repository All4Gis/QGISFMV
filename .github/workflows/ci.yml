name: CI

on:
  push:
    branches:
      - master
      - main
      - dev
  pull_request:
    branches:
      - master
      - main
      - dev

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('code/requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest code/tests/ \
            --ignore=code/tests/test_misb_coords.py \
            -v --tb=short -x

      - name: Check formatting (black)
        run: |
          black --check code/ --exclude code/gui

      # - name: Check imports (isort)
      #   run: |
      #     isort --check-only code/ --skip code/gui

      - name: Lint code (pycodestyle)
        run: |
          pycodestyle \
            --ignore=E203,E402,E226,E501,W503 \
            code/*.py code/**/*.py \
            --statistics \
            --exclude=code/gui/*.py,code/QGISFMV

          pycodestyle \
            --ignore=E203,E402,E501,W503,W504 \
            deploy/*.py \
            --statistics